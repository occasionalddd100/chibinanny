name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - name: Collect installer
        shell: bash
        run: cp src-tauri/target/release/bundle/nsis/*.exe ChibiNanny-setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: ChibiNanny ${{ github.run_number }}
          files: ChibiNanny-setup.exe
          make_latest: true
