name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # every build gets its own version so installed apps see it as an update;
      # without the signing key secrets the installer is built without update files
      - name: Version and updater switch
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node -e "
            const fs = require('fs'), f = 'src-tauri/tauri.conf.json', j = JSON.parse(fs.readFileSync(f));
            j.version = '0.1.${{ github.run_number }}';
            if (process.env.HAS_KEY !== 'true') j.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(f, JSON.stringify(j, null, 2));
          "
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: ChibiNanny __VERSION__
          releaseBody: Скачай *-setup.exe и запусти. Уже установленный Пшик обновится сам.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
