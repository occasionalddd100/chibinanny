[package]
name = "chibinanny"
version = "0.1.0"
edition = "2021"

[lib]
name = "chibinanny_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"

[profile.release]
strip = true
lto = true
